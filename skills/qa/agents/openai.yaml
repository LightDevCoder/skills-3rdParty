interface:
  display_name: "Qa"
  short_description: "Interactive QA session where user reports bugs or issues conversationally, and the agent files GitHub issues. Explores the codebase in the background for context and domain language. Use when user wants to report bugs, do QA, file issues conversationally, or mentions \"QA session\"."
  default_prompt: "Use $qa when this task matches its upstream contract; preserve its explicit stopping boundary."

policy:
  allow_implicit_invocation: true
