interface:
  display_name: "Research"
  short_description: "Investigate a question against high-trust primary sources and capture the findings as a Markdown file in the repo. Use when the user wants a topic researched, docs or API facts gathered, or reading legwork delegated to a background agent."
  default_prompt: "Use $research when this task matches its upstream contract; preserve its explicit stopping boundary."

policy:
  allow_implicit_invocation: true
