interface:
  display_name: "Wayfinder"
  short_description: "Plan a huge chunk of work — more than one agent session can hold — as a shared map of investigation tickets on your issue tracker, and resolve them one at a time until the way to the destination is clear."
  default_prompt: "Use $wayfinder when this task matches its upstream contract; preserve its explicit stopping boundary."

policy:
  allow_implicit_invocation: false
